# Gold query set for retrieval evaluation.
# Written by hand from data/raw/<course>/<lab>/lab.xml (titles, section ids, example tasks) and
# data/raw/<course>/_lectures/<topic>/index.md. Section ids are encoded as
# "<document_id>#<section_id>", the same key the chunks table stores in (document_id, section_id).
# Tags: kind:<definitional|howto|api|task|cross>, course:<sop1|sop2>, lang:pl for Polish queries.
# Task chunks carry no section id (the hierarchical chunker drops it), so task-style queries name
# expected labs only.
queries:
  # ---------------------------------------------------------------- sop1/l0
  - id: l0_program_arguments
    query: how do I read the positional command line arguments of a C program
    expected_lab_ids: [sop1/l0]
    expected_section_ids:
      - "sop1/l0#task-4-program-parameters-1"
      - "sop1/l0#task-5-program-parameters-2"
    tags: [kind:howto, course:sop1]
  - id: l0_getenv
    query: what does getenv return when the environment variable is not set
    expected_lab_ids: [sop1/l0]
    expected_section_ids: ["sop1/l0#task-6-environment-variables-1"]
    tags: [kind:api, course:sop1]
  - id: l0_perror
    query: how to report a failed system call with perror and errno
    expected_lab_ids: [sop1/l0]
    expected_section_ids: ["sop1/l0#task-8-error-handling"]
    tags: [kind:howto, course:sop1]
  - id: l0_stdin_stderr
    query: reading a line from stdin and printing diagnostics on stderr
    expected_lab_ids: [sop1/l0]
    expected_section_ids: ["sop1/l0#task-2-stdin-stderr"]
    tags: [kind:howto, course:sop1]

