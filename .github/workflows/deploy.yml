name: deploy

# Deploys through the Vercel CLI with a project token, so any collaborator with push rights gets
# a preview URL per pull request and a production deployment on every merge into main.
# The build itself runs on Vercel (services from vercel.json); the runner only uploads sources.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    name: preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel@59
      - name: Deploy preview
        id: deploy
        run: |
          url=$(vercel deploy --yes --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployment: ${{ steps.deploy.outputs.url }}`
            })

  production:
    name: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel@59
      - name: Deploy production
        run: |
          url=$(vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
