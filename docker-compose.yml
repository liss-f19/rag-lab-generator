services:
  db:
    image: pgvector/pgvector:pg16
    container_name: raglab-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: raglab
    ports:
      - "5433:5432"
    volumes:
      - raglab-pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d raglab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  raglab-pgdata:
